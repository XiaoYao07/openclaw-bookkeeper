<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人财务看板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>💰 个人财务看板</h1>
      <span class="refresh-hint">每 30 秒自动刷新</span>
    </header>

    <!-- 概览卡片 -->
    <section class="overview" id="overview">
      <div class="card expense">
        <span class="label">本月支出</span>
        <span class="value" id="total-expense">¥ --</span>
      </div>
      <div class="card income">
        <span class="label">本月收入</span>
        <span class="value" id="total-income">¥ --</span>
      </div>
      <div class="card balance">
        <span class="label">本月结余</span>
        <span class="value" id="total-balance">¥ --</span>
      </div>
      <div class="card daily">
        <span class="label">日均支出</span>
        <span class="value" id="daily-avg">¥ --</span>
      </div>
    </section>

    <!-- AI 洞察 -->
    <section class="insight" id="insight-section" style="display:none;">
      <div class="insight-card">
        <h3>🤖 AI 消费洞察</h3>
        <p id="insight-text"></p>
      </div>
    </section>

    <!-- 图表区 -->
    <section class="charts">
      <div class="chart-box">
        <h3>📊 本月分类占比</h3>
        <canvas id="category-chart"></canvas>
      </div>
      <div class="chart-box">
        <h3>📈 近 30 天支出趋势</h3>
        <canvas id="trend-chart"></canvas>
      </div>
    </section>

    <!-- 最近记录 -->
    <section class="recent">
      <h3>📋 最近 10 条记录</h3>
      <table id="recent-table">
        <thead>
          <tr>
            <th>日期</th>
            <th>分类</th>
            <th>项目</th>
            <th>金额</th>
            <th>备注</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <footer>
      <p>通过微信发送记账信息，数据实时同步</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
